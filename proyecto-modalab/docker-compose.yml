services:
  modalab:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      APP_ENV: demo
      MODALAB_ADMIN_PASSWORD: ${MODALAB_ADMIN_PASSWORD:?Copia .env.example en .env}
      MODALAB_SELLER_PASSWORD: ${MODALAB_SELLER_PASSWORD:?Copia .env.example en .env}
      MODALAB_DB_PATH: /app/data/modalab.sqlite
    ports:
      - "3000:3000"
    volumes:
      - modalab-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/auth/me').then(r => process.exit(r.status === 401 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  modalab-data:
